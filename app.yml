version: 2

name: SMART_CROWD_COUNTER
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: KAMESH_DEMOS_S

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - output
  - test-results
  - playwright-report
  - "*.tsbuildinfo"
  - app.yml.builder

label: Smart Crowd Counter
description: AI estimates from conference photos
icon: public/icon.svg
min_instances: 1
max_instances: 1
external_access_integrations:
  - SMART_CROWD_COUNTER_PG_EAI
  - SMART_CROWD_COUNTER_TILES_EAI
secrets:
  - name: PG_CREDENTIALS
    secret: CROWD_COUNTER_DB.CONFERENCES.SMART_CROWD_COUNTER_PG_SECRET
  - name: PG_CA
    secret: CROWD_COUNTER_DB.CONFERENCES.SMART_CROWD_COUNTER_PG_CA
environment_variables:
  # Replace with your Snowflake Postgres instance host before deploying.
  - name: PGHOST
    value: <your-postgres-instance-host>.snowflake.app
  - name: SNOWFLAKE_DATABASE
    value: CROWD_COUNTER_DB
  - name: SNOWFLAKE_SCHEMA
    value: CONFERENCES
install:
  commands:
    - ["npm", "ci", "--include=dev"]
build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]
run:
  command: ["node", ".next/standalone/server.js"]

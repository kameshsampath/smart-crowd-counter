name: Docs

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  SITE_DIR: "site"

permissions:
  contents: write

jobs:
  buildAndDeploySite:
    name: "Build and deploy the docs site with MkDocs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build site
        run: |
          mkdocs build --strict
      - name: Deploy site
        id: deploy_site
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "${{ env.SITE_DIR }}"
          publish_branch: "gh-pages"
          full_commit_message: "docs: rebuild site from ${{ github.sha }}"

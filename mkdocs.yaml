site_name: "Smart Crowd Counter"
site_url: https://kameshsampath.github.io/smart-crowd-counter/
copyright: "Copyright 2026 Kamesh Sampath - Apache-2.0 (see LICENSE)"
site_description: >
  Local, self-contained AI crowd counting: upload session photos and get
  attendee and raised-hand estimates from a local Ollama vision model via a
  Google ADK agent, with photos stored in MinIO AIStor.
docs_dir: docs
exclude_docs: |
  requirements.txt
  pyproject.toml
  .venv/
  documentation.md
  idd/*
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
theme:
  name: material
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
nav:
  - "Overview": index.md
  - "Quickstart": quickstart.md
  - "Environment Setup": setup.md
  - "Architecture": architecture.md
  - "Running the Demo": demo.md
  - "Storage and Data Model": storage.md
  - "Governed Agent (OpenShell)":
      - "Design": openshell.md
      - "Policy and Profiles": sandbox-policy.md
      - "Demo Walkthrough": governed-agent.md
  - "What's Next": whats-next.md
  - "Glossary": glossary.md
  - "References":
      - "API": api.md
      - "Links and Docs": references.md
  - "Run with Docker": docker.md
  - "Troubleshooting": troubleshooting.md
markdown_extensions:
  - toc:
      baselevel: 1
      permalink: "&para;"
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search

# https://taskfile.dev

version: "3"

dotenv: [".env", ".env.local"]

vars:
    SNOWFLAKE_DATABASE: '{{.SNOWFLAKE_DATABASE | default "CROWD_COUNTER_DB"}}'
    SNOWFLAKE_SCHEMA: '{{.SNOWFLAKE_SCHEMA | default "CONFERENCES"}}'
    SNOWFLAKE_STAGE: '{{.SNOWFLAKE_STAGE | default "SNAPS"}}'
    AI_MODEL: '{{.AI_MODEL | default "claude-4-sonnet"}}'

tasks:
    default:
        desc: Show available tasks
        cmds:
            - task --list

    # =========================================================================
    # Snowflake CLI Tasks (snow:*)
    # =========================================================================

    snow:check:
        desc: Verify Snowflake CLI is installed and configured
        cmds:
            - snow --version
            - snow connection test
        silent: true

    snow:setup:
        desc: Create all Snowflake objects (database, schema, stage, view)
        deps: [snow:check]
        cmds:
            - |
                snow sql -f setup.sql --templating=ALL \
                  -D database={{.SNOWFLAKE_DATABASE}} \
                  -D schema={{.SNOWFLAKE_SCHEMA}} \
                  -D stage={{.SNOWFLAKE_STAGE}} \
                  -D ai_model={{.AI_MODEL}}
        sources:
            - setup.sql

    snow:setup:dry-run:
        desc: Preview the rendered SQL without executing
        deps: [snow:check]
        cmds:
            - |
                snow sql -f setup.sql --templating=ALL \
                  -D database={{.SNOWFLAKE_DATABASE}} \
                  -D schema={{.SNOWFLAKE_SCHEMA}} \
                  -D stage={{.SNOWFLAKE_STAGE}} \
                  -D ai_model={{.AI_MODEL}} \
                  --dry-run

    snow:upload:
        desc: Upload images to Snowflake stage
        summary: |
            Upload image files to the configured Snowflake stage.

            Usage:
              task snow:upload -- /path/to/images/*.jpg
              task snow:upload -- photo1.jpg photo2.png
        deps: [snow:check]
        cmds:
            - |
                for file in {{.CLI_ARGS}}; do
                  echo "Uploading: $file"
                  snow stage copy "$file" "@{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}/"
                done
            - task: snow:refresh

    snow:refresh:
        desc: Refresh the stage directory table
        deps: [snow:check]
        cmds:
            - snow sql -q "ALTER STAGE {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}} REFRESH"

    snow:list:
        desc: List files in the stage
        deps: [snow:check]
        cmds:
            - snow sql -q "LIST @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}"

    snow:query:
        desc: Query the smart crowd counter view
        deps: [snow:check]
        cmds:
            - snow sql -q "SELECT name, total_attendees, raised_hands, percentage_with_hands_up FROM
              {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.SMART_CROWD_COUNTER"

    snow:clean:
        desc: Remove uploaded files from stage (keeps objects)
        deps: [snow:check]
        cmds:
            - echo "⚠️  WARNING - This will delete ALL files from stage
              @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}"
            - snow sql -q "REMOVE @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}/"
            - echo "✅ Stage cleaned successfully"
        prompt:
            "⚠️  DESTRUCTIVE ACTION: Delete all files from
            @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}?"

    snow:teardown:
        desc: Drop all created Snowflake objects (DESTRUCTIVE)
        deps: [snow:check]
        cmds:
            - |
                echo "⚠️  WARNING - The following objects will be PERMANENTLY DELETED:"
                echo "   • View:   {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.SMART_CROWD_COUNTER"
                echo "   • Stage:  {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}"
                echo "   • Schema: {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}} (and all objects within)"
                echo ""
            - snow sql -q "DROP VIEW IF EXISTS {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.SMART_CROWD_COUNTER"
            - snow sql -q "DROP STAGE IF EXISTS {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}"
            - snow sql -q "DROP SCHEMA IF EXISTS {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}"
            - echo "✅ Teardown complete - all objects dropped"
        prompt: "🚨 DESTRUCTIVE ACTION: Drop schema {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}} and ALL its objects?"

    # =========================================================================
    # App Tasks (app:*)
    # =========================================================================

    app:dev:
        desc: Start Next.js development server
        cmds:
            - npm run dev

    app:build:
        desc: Build the Next.js application
        cmds:
            - npm run build

    app:deploy:
        desc: Deploy to Snowflake App Runtime
        deps: [snow:check]
        cmds:
            - snow app deploy

    app:open:
        desc: Open the deployed app in browser
        deps: [snow:check]
        cmds:
            - snow app open

    app:reset:
        desc: Clear all images from stage (for demo reset)
        deps: [snow:check]
        cmds:
            - snow sql -q "REMOVE @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}/"
            - snow sql -q "ALTER STAGE {{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}} REFRESH"
            - echo "Stage cleared - ready for fresh demo"
        prompt: "Clear all images from @{{.SNOWFLAKE_DATABASE}}.{{.SNOWFLAKE_SCHEMA}}.{{.SNOWFLAKE_STAGE}}?"

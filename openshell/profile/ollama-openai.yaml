# Ollama inference provider profile — credentialless, host-local.
# Source: NVIDIA docs "Inference" (how-it-works/inference), verified at
# docs Latest v0.1.8 on 2026-11-11; the binaries list is trimmed to the
# actual paths in agent/Dockerfile.sandbox's image (verified with
# podman run: /sandbox/.venv/bin/python -> /usr/local/bin/python3.12,
# curl at /usr/bin/curl; /usr/bin/python* and /sandbox/.uv do not exist).
id: ollama-openai
display_name: Ollama
description: Host-local Ollama OpenAI-compatible API (Windows host, CUDA)
category: inference
inference_capable: true
credentials: []
endpoints:
  - host: host.openshell.internal
    port: 11434
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/local/bin/python
  - /usr/local/bin/python3
  - /usr/local/bin/python3.*
  - /sandbox/.venv/**

# Sandbox policy for the Smart Crowd Counter ADK agent.
# Schema-valid fields only; unknown fields are rejected by the gateway.
# Network allows come solely from the attached provider profiles
# (ollama-openai :11434, minio-aistor-s3 :9000) — see docs/sandbox-policy.md.
version: 1
filesystem_policy:
  include_workdir: true   # /sandbox (image WORKDIR) read-write
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement   # refuse to start without Landlock ABI >= 3 (linux/wsl2)
process:
  run_as_user: "1500"               # non-root, matches USER sandbox in agent/Dockerfile.sandbox
  run_as_group: "1500"
